name: CI
on:
  pull_request:
    branches: [ main ]
  merge_group:

jobs:
  check-dist:
    name: Check dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - run: corepack enable
      - name: Install dependencies
        run: npm install
      - name: Rebuild dist
        run: |
          npm run build
          npm run package
      - name: Compare the expected and actual dist/ directories
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi

  build:
    name: Build actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: corepack enable
      - run: npm install
      - run: npm run all

  test:
    strategy:
      fail-fast: false
      matrix:
        zig: [ 0.15.0-dev.847+850655f06, 0.13.0, 0.12.1, master ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    name: Zig ${{ matrix.zig }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: ./
        with:
          zig-version: ${{ matrix.zig }}
      - run: zig run tests/simple.zig

  required:
    name: Required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - check-dist
      - build
      - test
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.check-dist.result }}" == "success" \
              && "${{ needs.build.result }}" == "success" \
              && "${{ needs.test.result }}" == "success" \
              ) ]]; then
            echo "Required jobs haven't been completed successfully."
            exit -1
          fi
